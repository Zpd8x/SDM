name: Bug report
description: Report a reproducible SDM problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SDM version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [Setup, Portable, Source]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: diagnostics
    attributes:
      label: System Center diagnostic details
