name: Bug report
description: Report a reproducible SDM problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDM version
      placeholder: 3.2.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and steps
